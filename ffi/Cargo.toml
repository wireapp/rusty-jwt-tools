[package]
name = "rusty-jwt-tools-ffi"
description = "FFI bindings that provide DPoP access token creation API"
version = "0.15.0"
edition = "2024"
repository = "https://github.com/wireapp/rusty-jwt-tools"
license = "MPL-2.0"
publish = false

[lib]
name = "rusty_jwt_tools_ffi"
crate-type = ["cdylib", "staticlib"]

[lints]
workspace = true

[dependencies]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusty-jwt-tools = { version = "0.15.0", path = "../jwt" }
uuid = { workspace = true, features = ["std", "v4"] }
